name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          node -e 'const fs = require("node:fs"); const html = fs.readFileSync("index.html", "utf8"); const start = html.indexOf("<script>"); const end = html.indexOf("</script>", start); if (!html.toLowerCase().includes("<!doctype html>") || !html.includes("<title>Aishu — About Me</title>") || start < 0 || end < 0) throw new Error("Basic HTML checks failed"); fs.writeFileSync("/tmp/aishu-inline.js", html.slice(start + 8, end));'
          node --check /tmp/aishu-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
